[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdrnet"
version = "0.2.0"
description = "Relation, structure, and hierarchy modeling for post-disaster UAV segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "HDRNet authors"}]
dependencies = ["torch>=2.6,<3", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Repository = "https://github.com/MingJ-Zhang/HDRNet"
Issues = "https://github.com/MingJ-Zhang/HDRNet/issues"

[tool.setuptools.packages.find]
include = ["hdrnet*", "baselines*", "configs*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
